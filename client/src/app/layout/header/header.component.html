<header class="site-header">
  <div class="bar max-w-screen-2xl mx-auto">
    <!-- Logo -->
    <a routerLink="/" class="logo" aria-label="Breeze home">
      <img src="/images/logo2.png" alt="Breeze" />
    </a>

    <!-- Primary nav -->
    <nav class="nav" aria-label="Main">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
      <a routerLink="/shop" routerLinkActive="active">Shop</a>
      <!-- <a *appIsAdmin routerLink="/test-error" routerLinkActive="active">Errors</a> -->
      <a *appIsAdmin routerLink="/admin" routerLinkActive="active">Admin</a>
    </nav>

    <!-- Actions -->
    <div class="actions">
      <a routerLink="/cart" routerLinkActive="active" class="icon-btn cart-btn" aria-label="Cart"
        [matBadge]="cartService.itemCount()" [matBadgeHidden]="!cartService.itemCount()" matBadgeSize="medium">
        <mat-icon>shopping_bag</mat-icon>
      </a>

      @if (accountService.currentUser(); as user) {
        <button class="user-btn" [matMenuTriggerFor]="menu" aria-label="Account menu">
          <span class="avatar">{{ user.email.charAt(0).toUpperCase() }}</span>
          <span class="email hidden md:inline">{{ user.email }}</span>
          <mat-icon class="caret">expand_more</mat-icon>
        </button>
      } @else {
        <a routerLink="/account/login" class="pill pill-ghost">Log in</a>
        <a routerLink="/account/register" class="pill pill-solid">Sign up</a>
      }
    </div>
  </div>

  @if (busyService.loading) {
    <mat-progress-bar class="loader" mode="indeterminate"></mat-progress-bar>
  }
</header>

<mat-menu #menu="matMenu" xPosition="before" class="breeze-menu">
  <button mat-menu-item routerLink="/cart">
    <mat-icon>shopping_bag</mat-icon>
    My cart
  </button>
  <button mat-menu-item routerLink="/orders">
    <mat-icon>receipt_long</mat-icon>
    My orders
  </button>
  <mat-divider></mat-divider>
  <button mat-menu-item (click)="logout()">
    <mat-icon>logout</mat-icon>
    Log out
  </button>
</mat-menu>
