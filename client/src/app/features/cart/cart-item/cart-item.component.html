@let it = item();
<article class="row" [style.--tint]="tint()">
  <a [routerLink]="['/shop', it.productId]" class="thumb" [attr.aria-label]="'View ' + it.productName">
    <img [src]="it.pictureUrl" [alt]="it.productName" />
  </a>

  <div class="meta">
    @if (it.brand) { <span class="brand">{{ it.brand }}</span> }
    <a [routerLink]="['/shop', it.productId]" class="display name">{{ it.productName }}</a>
    <span class="unit">{{ it.price | currency: 'EGP ' : 'symbol' : '1.0-0' }} each</span>
  </div>

  <div class="controls">
    <div class="stepper" role="group" [attr.aria-label]="'Quantity of ' + it.productName">
      <button type="button" (click)="decrementQuantity()"
        [attr.aria-label]="it.quantity === 1 ? 'Remove ' + it.productName : 'Decrease quantity'">
        <mat-icon>{{ it.quantity === 1 ? 'delete_outline' : 'remove' }}</mat-icon>
      </button>
      <output aria-live="polite">{{ it.quantity }}</output>
      <button type="button" (click)="incrementQuantity()" aria-label="Increase quantity">
        <mat-icon>add</mat-icon>
      </button>
    </div>

    <span class="total display">{{ lineTotal() | currency: 'EGP ' : 'symbol' : '1.0-0' }}</span>

    <button type="button" class="remove" (click)="removeItemFromCart()" [attr.aria-label]="'Remove ' + it.productName + ' from bag'">
      <mat-icon>close</mat-icon>
    </button>
  </div>
</article>
