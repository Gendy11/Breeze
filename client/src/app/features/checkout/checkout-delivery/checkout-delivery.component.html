<div class="choice-grid" role="radiogroup" aria-label="Delivery method">
  @for (method of checkoutService.deliveryMethods; track method.id; let i = $index) {
    <label class="choice" [class.on]="cartService.selectedDelivery()?.id === method.id">
      <input type="radio" name="delivery" [value]="method.id"
        [checked]="cartService.selectedDelivery()?.id === method.id"
        (change)="updateDeliveryMethod(method)" />
      <span class="choice-icon"><mat-icon>{{ icons[i % icons.length] }}</mat-icon></span>
      <span class="choice-text">
        <strong>{{ method.shortName }}</strong>
        <span>{{ method.description }}</span>
        @if (method.deliveryTime) {
          <span class="time"><mat-icon>schedule</mat-icon>{{ method.deliveryTime }}</span>
        }
      </span>
      <span class="price">
        @if (method.price === 0) { Free } @else { {{ method.price | currency: 'EGP ' : 'symbol' : '1.0-0' }} }
      </span>
      <span class="radio-dot" aria-hidden="true"></span>
    </label>
  } @empty {
    @for (i of [0, 1]; track i) {
      <div class="choice skeleton" aria-hidden="true"></div>
    }
  }
</div>
